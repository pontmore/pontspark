name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check commit subjects
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            node scripts/check-commit-message.mjs --message "$subject"
          done
      - run: npm run typecheck
      - run: npm test

  # Release pull requests build the exact APK the release will ship, signed
  # with the upload key, so a broken build is caught before the tag exists.
  android:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
