name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
      EXPO_PUBLIC_BREEZ_NETWORK: mainnet
      APK: pontspark-${{ needs.release.outputs.tag_name }}.apk
    steps:
      - name: Require release secrets
        env:
          KEYSTORE: ${{ secrets.PONTSPARK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PONTSPARK_STORE_PASSWORD }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_BREEZ_API_KEY KEYSTORE STORE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing release secret for $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install the upload key
        env:
          KEYSTORE: ${{ secrets.PONTSPARK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_PONTSPARK_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          ORG_GRADLE_PROJECT_PONTSPARK_UPLOAD_STORE_PASSWORD: ${{ secrets.PONTSPARK_STORE_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verify the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then echo "::error::APK is debug-signed"; exit 1; fi

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
